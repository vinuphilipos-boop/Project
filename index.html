<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Prioritize tasks by urgency and importance." />
  <meta name="theme-color" content="#1f2328" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Eisenhower" />
  <title>Eisenhower Box</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>Eisenhower Box</h1>
      <p class="subtitle">Sort tasks by urgency and importance. Drag tasks, or use the menu on each task to move it.</p>
    </div>
    <button id="install-btn" type="button" hidden>Install app</button>
  </header>

  <form id="task-form" autocomplete="off">
    <input id="task-input" type="text" placeholder="What needs doing?" required maxlength="200" />
    <label><input id="urgent-input" type="checkbox" /> Urgent</label>
    <label><input id="important-input" type="checkbox" /> Important</label>
    <button type="submit">Add task</button>
  </form>

  <main class="matrix">
    <div class="axis axis-top"><span>Urgent</span><span>Not urgent</span></div>
    <div class="axis axis-side"><span>Important</span><span>Not important</span></div>

    <section class="quadrant q1" data-quadrant="do">
      <h2>Do <small>Urgent &amp; important</small></h2>
      <ul class="task-list"></ul>
    </section>
    <section class="quadrant q2" data-quadrant="schedule">
      <h2>Schedule <small>Not urgent &amp; important</small></h2>
      <ul class="task-list"></ul>
    </section>
    <section class="quadrant q3" data-quadrant="delegate">
      <h2>Delegate <small>Urgent &amp; not important</small></h2>
      <ul class="task-list"></ul>
    </section>
    <section class="quadrant q4" data-quadrant="delete">
      <h2>Delete <small>Not urgent &amp; not important</small></h2>
      <ul class="task-list"></ul>
    </section>
  </main>

  <footer>
    <button id="export-btn" type="button" class="secondary">Export</button>
    <label class="button secondary" for="import-file">Import</label>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <button id="clear-done" type="button" class="secondary">Clear completed</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
